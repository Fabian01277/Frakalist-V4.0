<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraka List V4.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1>Fraka List V4.0</h1>
  <p>Bienvenido a la nueva pagina web de la frakalist, aqui encontraras los niveles más dificiles que el Frakaclan a completado</p>
  
  <button onclick="window.location.href='levels/index.html'">Ver lista</button>
  <button class="naranja" onclick="window.location.href='players/index.html'">Jugadores</button>
  <button class="hanky" onclick="window.location.href='reglas/index.html'">Reglas</button>

  <!-- VITRINA DEL GANADOR DEL FRAKA DEL MES -->
  <div id="vitrina-fraka-mes-inicio"></div>

  <h2 style="margin-top: 35px; color: #fca5a5;">👑 Fraka Liders 👑</h2>

  <div class="contenedor-lideres">
    <a href="https://www.youtube.com/@Kepta-BB" target="_blank" class="lider-card">
      <img src="https://yt3.googleusercontent.com/5txd4q060y6gDxWeZqjXPc-n07QGlQ4O8dbWJaJWDlElcA5SzVRw3X1WDTwXsBpsJS7g09xXiQ=s160-c-k-c0x00ffffff-no-rj" alt="Kepta_bb">
      <span>Kepta_bb</span>
    </a>

    <a href="https://www.youtube.com/@S3bAs506GD" target="_blank" class="lider-card">
      <img src="https://yt3.googleusercontent.com/GPX0kVQAFsRkYfHoUL-k36XTMkjNT2G_2h4toxbVoToY2j-Q_iDVy8HexzFNRrfRwKShxl_p=s160-c-k-c0x00ffffff-no-rj" alt="s3bAs506">
      <span>s3bAs506</span>
    </a>

    <a href="https://www.youtube.com/@theglaicat" target="_blank" class="lider-card">
      <img src="https://yt3.googleusercontent.com/JtBEdJ-1LFiQRadrWghWDHuOsmRormavoxqdarMKoyHpYTOLbdZT2ESY9UEcH1CWHGZm5sVfths=s160-c-k-c0x00ffffff-no-rj" alt="Theglaicat">
      <span>Theglaicat</span>
    </a>

    <a href="https://www.youtube.com/@xReizer_8" target="_blank" class="lider-card">
      <img src="https://yt3.googleusercontent.com/GSnzYppP9YP9wpIJXwkimNEaXJnJQF57jxPw09peFuTuKhO82jlvuESs1qs07QKdBkcDUz10=s160-c-k-c0x00ffffff-no-rj" alt="xReizer_8">
      <span>xReizer_8</span>
    </a>
  </div>

  <!-- Scripts globales + Datos del Fraka del Mes y Jugadores -->
  <script src="menu.js"></script>
  <script src="players/datos/lista_jugadores.js"></script>
  <script src="fraka-mes/datos/ganadores.js"></script>
  <script>
    inicializarMenuGlobal("");

    // Muestra al ganador actual del Fraka del Mes en el Inicio si ya hay uno registrado
    const cajaInicio = document.getElementById("vitrina-fraka-mes-inicio");
    if (typeof historialFrakaDelMes !== "undefined" && historialFrakaDelMes.length > 0 && cajaInicio) {
      const ganador = historialFrakaDelMes[0];
      const datosJug = typeof listaJugadores !== "undefined"
        ? listaJugadores.find(j => j.nombre.toLowerCase() === ganador.jugador.toLowerCase())
        : null;
      const foto = datosJug ? datosJug.fotoPerfil : `https://gdbrowser.com/icon/${ganador.jugador}`;

      cajaInicio.innerHTML = `
        <div class="tarjeta-fraka-mes" style="cursor: pointer;" onclick="window.location.href='fraka-mes/index.html'">
          <div>
            <span class="badge-puntos" style="border-color: #fbbf24; color: #fde047; font-weight: bold; background: rgba(0,0,0,0.4);">
              ✨ FRAKA DEL MES • ${ganador.periodo} ✨
            </span>
          </div>

          <div class="avatar-con-corona">
            <span class="corona-flotante">👑</span>
            <img src="${foto}" alt="${ganador.jugador}" style="width: 92px; height: 92px; border-radius: 50%; border: 3px solid #fbbf24; object-fit: cover; box-shadow: 0 0 18px rgba(251, 191, 36, 0.7);">
          </div>

          <h2 style="margin: 4px 0; color: #fde047; font-size: 28px; text-shadow: 0 0 12px rgba(251, 191, 36, 0.8);">
            ${ganador.jugador}
          </h2>

          <div style="margin: 10px 0;">
            <span class="badge-puntos" style="background: rgba(251, 191, 36, 0.25); border-color: #fbbf24; color: #ffffff; font-size: 15px;">
              🔥 Nivel completado: <strong>${ganador.nivel}</strong>
            </span>
          </div>

          <p style="margin: 8px 0 0 0; font-size: 14px; color: #fef08a;">
            ${ganador.hazana}
          </p>
        </div>
      `;
    }
  </script>

</body>
</html>
