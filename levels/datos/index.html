<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Oficial - Fraka List V4.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <!-- VISTA PRINCIPAL DE LA LISTA -->
  <div id="vista-lista">
    <h1>Lista Oficial - Frakaclan</h1>
    <button onclick="window.location.href='../index.html'">⬅ Volver al inicio</button>
    <div id="contenedor-niveles"></div>
  </div>

  <!-- VISTA DETALLADA DE UN NIVEL -->
  <div id="vista-detalle-nivel" class="oculto">
    <button onclick="volverALista()">⬅ Volver a la lista</button>
    <div id="contenido-detalle-nivel"></div>
  </div>

  <!-- SCRIPTS COMPARTIDOS Y DATOS -->
  <script src="../menu.js"></script>
  <script src="datos/lista_niveles.js"></script>
  <script src="datos/orden.js"></script>
  <script src="../players/datos/lista_jugadores.js"></script>
  <script>
    inicializarMenuGlobal("../");

    // 1. Ordena los niveles según 'orden.js' (del #1 más difícil al más fácil)
    const nivelesOrdenados = ordenNiveles
      .map(nombreOrden => listaNiveles.find(n => n.nombre.toLowerCase() === nombreOrden.toLowerCase()))
      .filter(n => n !== undefined);

    // 2. Dibuja las tarjetas en pantalla
    function renderizarLista() {
      const contenedor = document.getElementById("contenedor-niveles");
      contenedor.innerHTML = "";

      if (nivelesOrdenados.length === 0) {
        contenedor.innerHTML = `
          <div class="tarjeta" style="text-align: center;">
            <h2 style="justify-content: center;">📋 Lista en preparación</h2>
            <p>Aún no hay niveles registrados en la Fraka List V4.0.</p>
          </div>
        `;
        return;
      }

      nivelesOrdenados.forEach((nivel, index) => {
        const puntosNivel = calcularPuntosPorTop(index);
        contenedor.innerHTML += `
          <div class="tarjeta" style="cursor: pointer;" onclick="abrirDetalleNivel(${index})">
            <h2>
              <span>#${index + 1} - ${nivel.nombre}</span>
              <span class="badge-puntos">${puntosNivel} PTS</span>
            </h2>
            <p>Creador: ${nivel.creador} | Fraka verifier: ${nivel.verificador}</p>
          </div>
        `;
      });
    }

    // 3. Abre la ficha completa del nivel con flechas ← y →
    function abrirDetalleNivel(index) {
      const nivel = nivelesOrdenados[index];
      const puntosNivel = calcularPuntosPorTop(index);

      const jugadoresSeguros = typeof listaJugadores !== "undefined" ? listaJugadores : [];
      const victors = jugadoresSeguros
        .filter(j => j.nivelesCompletados.some(n => n.toLowerCase() === nivel.nombre.toLowerCase()))
        .map(j => j.nombre);

      const listaVictorsHTML = victors.length > 0
        ? victors.map(v => `<span class="badge-puntos" style="margin: 4px; display: inline-block;">🏆 ${v}</span>`).join("")
        : "<p>Aún no hay victors registrados.</p>";

      const botonAnterior = index > 0
        ? `<button onclick="abrirDetalleNivel(${index - 1})" style="font-size: 24px; padding: 8px 24px;">←</button>`
        : `<button disabled style="font-size: 24px; padding: 8px 24px; opacity: 0.3; cursor: not-allowed;">←</button>`;

      const botonSiguiente = index < nivelesOrdenados.length - 1
        ? `<button onclick="abrirDetalleNivel(${index + 1})" style="font-size: 24px; padding: 8px 24px;">→</button>`
        : `<button disabled style="font-size: 24px; padding: 8px 24px; opacity: 0.3; cursor: not-allowed;">→</button>`;

      document.getElementById("contenido-detalle-nivel").innerHTML = `
        <div style="display: flex; justify-content: center; gap: 12px; margin: 15px 0;">
          ${botonAnterior}
          ${botonSiguiente}
        </div>

        <div class="tarjeta">
          <h2>
            <span>#${index + 1} - ${nivel.nombre}</span>
            <span class="badge-puntos">${puntosNivel} PTS</span>
          </h2>

          <iframe src="https://www.youtube.com/embed/${nivel.videoID}" allowfullscreen></iframe>

          <div style="margin-top: 18px; line-height: 1.9; font-size: 16px;">
            <p><strong>🛠️ Creador:</strong> ${nivel.creador}</p>
            <p><strong>✅ Fraka Verifier:</strong> ${nivel.verificador}</p>
            <p><strong>🆔 ID del Nivel:</strong> ${nivel.idNivel}</p>
            <p><strong>📊 Porcentaje requerido:</strong> ${nivel.porcentajeRequerido}</p>
          </div>

          <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.15);">
            <h3 style="color: #fbbf24; margin: 0 0 10px 0;">👑 Victors del Frakaclan (${victors.length})</h3>
            <div>${listaVictorsHTML}</div>
          </div>
        </div>
      `;

      document.getElementById("vista-lista").style.display = "none";
      document.getElementById("vista-detalle-nivel").style.display = "block";
    }

    function volverALista() {
      document.getElementById("vista-detalle-nivel").style.display = "none";
      document.getElementById("vista-lista").style.display = "block";
    }

    renderizarLista();
  </script>

</body>
</html>
