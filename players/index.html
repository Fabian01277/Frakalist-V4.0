<!-- SCRIPTS COMPARTIDOS Y DATOS -->
  <script src="../menu.js"></script>
  <script src="datos/lista_jugadores.js"></script>
  <script>
    inicializarMenuGlobal("../");

    let nivelesOrdenados = [];
    let rankingGlobal = [];

    async function iniciarPlayers() {
      try {
        const resOrden = await fetch("../levels/datos/orden.json");
        const listaOrden = await resOrden.json();
        const promesas = listaOrden.map(archivo =>
          fetch(`../levels/datos/niveles/${archivo}.json`)
            .then(r => r.ok ? r.json() : null)
            .catch(() => null)
        );
        const resultados = await Promise.all(promesas);
        nivelesOrdenados = resultados.filter(n => n !== null);
      } catch (e) {
        nivelesOrdenados = [];
      }

      renderizarJugadores();
    }

    function renderizarJugadores() {
      const contenedor = document.getElementById("contenedor-jugadores");
      contenedor.innerHTML = "";

      if (typeof listaJugadores === "undefined" || listaJugadores.length === 0) {
        rankingGlobal = [];
        contenedor.innerHTML = `
          <div class="tarjeta-jugador" style="text-align: center;">
            <h2 style="justify-content: center;">🏆 Sin jugadores aún</h2>
            <p>Aún no hay récords de jugadores registrados en el ranking.</p>
          </div>
        `;
        return;
      }

      rankingGlobal = listaJugadores.map(jugador => {
        let totalPuntos = 0;
        let recordMasDificil = "Ninguno";
        let mejorTop = 999;

        jugador.nivelesCompletados.forEach(nombreNivel => {
          const indexNivel = nivelesOrdenados.findIndex(n => n.nombre.toLowerCase() === nombreNivel.toLowerCase());
          if (indexNivel !== -1) {
            totalPuntos += calcularPuntosPorTop(indexNivel);
            if (indexNivel < mejorTop) {
              mejorTop = indexNivel;
              recordMasDificil = `#${indexNivel + 1} - ${nivelesOrdenados[indexNivel].nombre}`;
            }
          }
        });

        const verificados = nivelesOrdenados
          .map((n, idx) => ({ ...n, top: idx + 1 }))
          .filter(n => n.verificador.toLowerCase() === jugador.nombre.toLowerCase());

        const creados = nivelesOrdenados
          .map((n, idx) => ({ ...n, top: idx + 1 }))
          .filter(n => n.creador.toLowerCase() === jugador.nombre.toLowerCase());

        return {
          nombre: jugador.nombre,
          fotoPerfil: jugador.fotoPerfil,
          puntos: totalPuntos,
          hardest: recordMasDificil,
          completadosLista: jugador.nivelesCompletados,
          verificados: verificados,
          creados: creados
        };
      });

      rankingGlobal.sort((a, b) => b.puntos - a.puntos);

      rankingGlobal.forEach((jug, index) => {
        contenedor.innerHTML += `
          <div class="tarjeta-jugador" style="cursor: pointer;" onclick="abrirDetalleJugador(${index})">
            <h2>
              <span>#${index + 1} - ${jug.nombre}</span>
              <span class="badge-puntos">${jug.puntos} PTS</span>
            </h2>
            <p>Niveles de lista: ${jug.completadosLista.length} | Récord más difícil: ${jug.hardest}</p>
          </div>
        `;
      });
    }

    function abrirDetalleJugador(index) {
      const jug = rankingGlobal[index];

      const botonAnterior = index > 0
        ? `<button onclick="abrirDetalleJugador(${index - 1})" style="font-size: 24px; padding: 8px 24px;">←</button>`
        : `<button disabled style="font-size: 24px; padding: 8px 24px; opacity: 0.3; cursor: not-allowed;">←</button>`;

      const botonSiguiente = index < rankingGlobal.length - 1
        ? `<button onclick="abrirDetalleJugador(${index + 1})" style="font-size: 24px; padding: 8px 24px;">→</button>`
        : `<button disabled style="font-size: 24px; padding: 8px 24px; opacity: 0.3; cursor: not-allowed;">→</button>`;

      const completadosHTML = jug.completadosLista.length > 0
        ? jug.completadosLista.map(nombre => {
            const idx = nivelesOrdenados.findIndex(n => n.nombre.toLowerCase() === nombre.toLowerCase());
            const texto = idx !== -1 ? `#${idx + 1} - ${nivelesOrdenados[idx].nombre}` : nombre;
            return `<span class="badge-puntos" style="margin: 4px; display: inline-block;">🏆 ${texto}</span>`;
          }).join("")
        : "<p>Ningún nivel completado aún.</p>";

      const verificadosHTML = jug.verificados.length > 0
        ? jug.verificados.map(n => `<span class="badge-puntos" style="margin: 4px; display: inline-block;">✅ #${n.top} - ${n.nombre}</span>`).join("")
        : "<p>Ningún nivel verificado en la lista.</p>";

      const creadosHTML = jug.creados.length > 0
        ? jug.creados.map(n => `<span class="badge-puntos" style="margin: 4px; display: inline-block;">🛠️ #${n.top} - ${n.nombre}</span>`).join("")
        : "<p>Ningún nivel creado en la lista.</p>";

      document.getElementById("contenido-detalle-jugador").innerHTML = `
        <div style="display: flex; justify-content: center; gap: 12px; margin: 15px 0;">
          ${botonAnterior}
          ${botonSiguiente}
        </div>

        <div class="tarjeta-jugador">
          <div style="display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap;">
            <img src="${jug.fotoPerfil}" onerror="this.src='https://gdbrowser.com/icon/${jug.nombre}'" alt="${jug.nombre}" style="width: 80px; height: 80px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.6); object-fit: cover;">
            <div>
              <h2 style="margin: 0;">#${index + 1} - ${jug.nombre}</h2>
              <span class="badge-puntos" style="display: inline-block; margin-top: 6px;">${jug.puntos} PTS TOTALES</span>
            </div>
          </div>

          <p style="font-size: 16px; margin-bottom: 15px;"><strong>🔥 Nivel más difícil completado:</strong> ${jug.hardest}</p>

          <div style="margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.18);">
            <h3 style="color: #fbbf24; margin: 0 0 8px 0; font-size: 17px;">🏆 Niveles Completados (${jug.completadosLista.length})</h3>
            <div>${completadosHTML}</div>
          </div>

          <div style="margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.18);">
            <h3 style="color: #4ade80; margin: 0 0 8px 0; font-size: 17px;">✅ Niveles Verificados (${jug.verificados.length})</h3>
            <div>${verificadosHTML}</div>
          </div>

          <div style="margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.18);">
            <h3 style="color: #38bdf8; margin: 0 0 8px 0; font-size: 17px;">🛠️ Niveles Creados (${jug.creados.length})</h3>
            <div>${creadosHTML}</div>
          </div>
        </div>
      `;

      document.getElementById("vista-jugadores").style.display = "none";
      document.getElementById("vista-detalle-jugador").style.display = "block";
    }

    function volverAJugadores() {
      document.getElementById("vista-detalle-jugador").style.display = "none";
      document.getElementById("vista-jugadores").style.display = "block";
    }

    iniciarPlayers();
  </script>
